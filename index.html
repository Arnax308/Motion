<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data:; connect-src 'self'">
  <title>Motion</title>
  <link rel="stylesheet" href="node_modules/@fontsource/inter/latin-400.css">
  <link rel="stylesheet" href="node_modules/@fontsource/inter/latin-500.css">
  <link rel="stylesheet" href="node_modules/@fontsource/inter/latin-600.css">
  <link rel="stylesheet" href="node_modules/@fontsource/inter/latin-700.css">
  <link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/latin-500.css">
  <link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/latin-600.css">
  <link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/latin-700.css">
  <link rel="stylesheet" href="node_modules/@tabler/icons-webfont/dist/tabler-icons-outline.min.css">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/views.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <div class="app">
    <aside class="side">
      <div class="logo">
        <div class="logo-mark"><i class="ti ti-bolt" aria-hidden="true"></i></div>
        <span class="logo-name">Motion</span>
      </div>
      <nav class="nav" data-nav aria-label="Pages"></nav>
      <div class="side-label"><span>CATEGORIES</span>
        <button class="icon-btn" data-add-cat title="New category" aria-label="New category"><i class="ti ti-plus" aria-hidden="true"></i></button>
      </div>
      <nav class="nav" data-cats aria-label="Categories"></nav>
      <div class="side-bottom">
        <div class="player" data-player></div>
        <div class="theme-switch" data-theme-switch></div>
      </div>
    </aside>

    <main class="main">
      <section class="page" id="page-tasks"></section>
      <section class="page" id="page-history"></section>
      <section class="page" id="page-stats"></section>
      <section class="page" id="page-categories"></section>
    </main>

    <aside class="rail" aria-label="Today's summary"></aside>
  </div>

  <div class="toasts" id="toasts" aria-live="polite"></div>

  <script src="js/engine.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/store.js"></script>
  <script src="js/views/tasks.js"></script>
  <script src="js/views/history.js"></script>
  <script src="js/views/stats.js"></script>
  <script src="js/views/categories.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
